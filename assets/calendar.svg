<filter id="sculpted-relief" x="-25%" y="-25%" width="160%" height="165%" color-interpolation-filters="sRGB">
<feMorphology in="SourceAlpha" operator="dilate" radius=".6" result="outline"/>
<feOffset in="outline" dx="3" dy="5" result="back"/>
<feFlood flood-color="#4b3428" result="edge-color"/><feComposite in="edge-color" in2="back" operator="in" result="edge"/>
<feGaussianBlur in="back" stdDeviation="3" result="blur"/><feOffset in="blur" dx="1" dy="4" result="cast"/>
<feFlood flood-color="#403122" flood-opacity=".22" result="shadow-color"/><feComposite in="shadow-color" in2="cast" operator="in" result="shadow"/>
<feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="surface"/>
<feSpecularLighting in="surface" surfaceScale="3" specularConstant=".45" specularExponent="22" lighting-color="#fff8e4" result="shine"><fePointLight x="-80" y="-120" z="220"/></feSpecularLighting>
<feComposite in="shine" in2="SourceAlpha" operator="in" result="highlight"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/><feMergeNode in="highlight"/></feMerge>
